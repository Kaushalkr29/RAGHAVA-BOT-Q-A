<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raghava AI Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{

            background:
            radial-gradient(circle at top,#203a43,#0f172a 55%,#020617);

            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;

        }

        .chat-container{

            width:950px;
            height:92vh;

            background:rgba(255,255,255,.08);

            backdrop-filter:blur(18px);

            border:1px solid rgba(255,255,255,.15);

            border-radius:22px;

            display:flex;
            flex-direction:column;

            box-shadow:
            0 20px 50px rgba(0,0,0,.35);

            overflow:hidden;

        }

        /* Header */

        .header{

            display:flex;
            align-items:center;
            justify-content:space-between;

            padding:18px 25px;

            background:rgba(255,255,255,.06);

            border-bottom:1px solid rgba(255,255,255,.08);

        }

        .brand{

            display:flex;
            align-items:center;
            gap:15px;

        }

        .logo{

            width:55px;
            height:55px;

            border-radius:50%;

            display:flex;
            justify-content:center;
            align-items:center;

            background:linear-gradient(135deg,#00d4ff,#4f46e5);

            color:white;

            font-size:24px;
            font-weight:bold;

        }

        .title h2{

            color:white;
            font-size:22px;

        }

        .title p{

            color:#b9c2cf;
            margin-top:3px;
            font-size:14px;

        }

        .status{

            color:#22c55e;
            font-size:14px;

        }

        /* Chat */

        .chat-box{

            flex:1;

            overflow-y:auto;

            padding:30px;

            scroll-behavior:smooth;

        }

        .chat-box::-webkit-scrollbar{

            width:7px;

        }

        .chat-box::-webkit-scrollbar-thumb{

            background:#3b82f6;
            border-radius:20px;

        }

        .message{

            display:flex;
            align-items:flex-end;

            margin-bottom:20px;

            animation:fade .3s ease;

        }

        @keyframes fade{

            from{

                opacity:0;
                transform:translateY(15px);

            }

            to{

                opacity:1;
                transform:translateY(0);

            }

        }

        .user{

            justify-content:flex-end;

        }

        .bot{

            justify-content:flex-start;

        }

        .avatar{

            width:42px;
            height:42px;

            border-radius:50%;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:20px;

            flex-shrink:0;

        }

        .bot .avatar{

            background:#2563eb;
            color:white;
            margin-right:10px;

        }

        .user .avatar{

            background:#4f46e5;
            color:white;
            margin-left:10px;
            order:2;

        }

        .bubble{

            max-width:70%;

            padding:16px 18px;

            border-radius:18px;

            line-height:1.7;

            font-size:15px;

            word-break:break-word;

        }

        .bot .bubble{

            background:rgba(255,255,255,.08);

            color:white;

            border:1px solid rgba(255,255,255,.08);

        }

        .user .bubble{

            background:linear-gradient(135deg,#2563eb,#4f46e5);

            color:white;

        }

        /* Typing */

        .typing{

            display:flex;
            gap:6px;
            padding:14px 18px;

        }

        .typing span{

            width:8px;
            height:8px;

            background:white;

            border-radius:50%;

            animation:bounce 1s infinite;

        }

        .typing span:nth-child(2){

            animation-delay:.2s;

        }

        .typing span:nth-child(3){

            animation-delay:.4s;

        }

        @keyframes bounce{

            0%,100%{

                transform:translateY(0);

            }

            50%{

                transform:translateY(-6px);

            }

        }

        /* Input */

        .input-area{

            display:flex;

            align-items:center;

            padding:18px;

            gap:15px;

            background:rgba(255,255,255,.05);

            border-top:1px solid rgba(255,255,255,.08);

        }

        input{

            flex:1;

            border:none;

            background:rgba(255,255,255,.08);

            color:white;

            padding:16px 18px;

            border-radius:15px;

            outline:none;

            font-size:15px;

        }

        input::placeholder{

            color:#c5c5c5;

        }

        button{

            width:58px;
            height:58px;

            border:none;

            border-radius:16px;

            cursor:pointer;

            background:linear-gradient(135deg,#2563eb,#4f46e5);

            color:white;

            font-size:22px;

            transition:.25s;

        }

        button:hover{

            transform:scale(1.08);

        }

    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">

        <div class="brand">

            <div class="logo">R</div>

            <div class="title">

                <h2>Raghava AI Assistant</h2>

                <p>Your Real Estate Expert</p>

            </div>

        </div>

        <div class="status">
            ● Online
        </div>

    </div>

    <div class="chat-box" id="chatBox">

        <div class="message bot">

            <div class="avatar">🤖</div>

            <div class="bubble">

                👋 Welcome to <b>Raghava Real Estate</b>.<br><br>

                I'm your AI assistant. Ask me about:

                <br><br>

                • Properties
                <br>
                • Projects
                <br>
                • Pricing
                <br>
                • Amenities
                <br>
                • Locations
                <br>
                • Booking Process

            </div>

        </div>

    </div>

    <div class="input-area">

        <input
        id="query"
        type="text"
        placeholder="Ask anything about Raghava..."
        autocomplete="off">

        <button onclick="sendMessage()">➜</button>

    </div>

</div>

<script>

const input=document.getElementById("query");

input.addEventListener("keypress",function(e){

    if(e.key==="Enter")
        sendMessage();

});

function addMessage(message,sender){

    const chat=document.getElementById("chatBox");

    const msg=document.createElement("div");

    msg.className="message "+sender;

    const avatar=document.createElement("div");

    avatar.className="avatar";

    avatar.innerHTML=sender==="user"?"👤":"🤖";

    const bubble=document.createElement("div");

    bubble.className="bubble";

    bubble.innerHTML=marked.parse(message);

    if(sender==="user"){

        msg.appendChild(bubble);
        msg.appendChild(avatar);

    }
    else{

        msg.appendChild(avatar);
        msg.appendChild(bubble);

    }

    chat.appendChild(msg);

    chat.scrollTop=chat.scrollHeight;

}

async function sendMessage(){

    const query=input.value.trim();

    if(query==="")
        return;

    addMessage(query,"user");

    input.value="";

    const chat=document.getElementById("chatBox");

    const typing=document.createElement("div");

    typing.className="message bot";

    typing.id="typing";

    typing.innerHTML=`
        <div class="avatar">🤖</div>
        <div class="bubble">
            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    `;

    chat.appendChild(typing);

    chat.scrollTop=chat.scrollHeight;

    const response=await fetch("/chat",{

        method:"POST",

        headers:{

            "Content-Type":"application/json"

        },

        body:JSON.stringify({

            query:query

        })

    });

    const data=await response.json();

    document.getElementById("typing").remove();

    addMessage(data.response,"bot");

}

</script>

</body>
</html>
